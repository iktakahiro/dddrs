# Supply-chain protection (Cargo 1.100+, RFC 3923):
# Exclude crate versions published more recently than 7 days when resolving
# new or updated dependencies. Existing Cargo.lock entries are kept as-is.
# Override for an urgent security fix with:
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate> --precise <version>
[registry]
global-min-publish-age = "7 days"
